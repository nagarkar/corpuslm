[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "corpuslm"
version = "0.1.0"
description = "The source-agnostic transcript corpus core shared by ytlm and beelm; owns the shared database schema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Shared transcript cleanup (corpuslm.transcript, corpuslm.basic_cleanup): the spell
# checker and the JSON schema validator. Versions as ytlm pins them.
clean = [
  "symspellpy>=6.7",
  "jsonschema>=4.0",
]
# Model transport (corpuslm.llm) for consumers that call a model; corpuslm itself calls none.
# jsonschema validates the ledger lines.
llm = [
  "litellm>=1.70",
  "jsonschema>=4.0",
]
dev = [
  "corpuslm[clean]",
  "pytest>=8.0",
  "ruff>=0.12",
  "pyright>=1.1.400",
  "mutmut>=3.3",
  "hypothesis>=6.130",
]

[project.scripts]
corpuslm = "corpuslm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corpuslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The review page's CSS and script live in Python strings (corpuslm.review_page); their lines
# are read by a browser, not a linter.
"src/corpuslm/review_page.py" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.mutmut]
# Core paths only (docs/design/testing.md): the schema, its migrations and
# the Repository.
paths_to_mutate = ["src/corpuslm/"]
do_not_mutate = [
  "src/corpuslm/__init__.py",
  "src/corpuslm/cli.py",
  "src/corpuslm/clock.py",
  "src/corpuslm/model.py",
]
tests_dir = ["tests/"]
also_copy = ["pyproject.toml", "docs/"]
